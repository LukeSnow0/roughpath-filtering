[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cubature-filtering"
version = "0.1.0"
description = "Wiener Space Cubature Kalman Filter for continuous-discrete nonlinear state estimation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.13"
dependencies = [
    # 0.0.14 changed ``cuthbert.filter`` to require ``init_state`` and T (not T+1)
    # model_inputs; pin until call sites / examples are migrated.
    "cuthbert>=0.0.12,<0.0.14",
    "cuthbertlib>=0.0.12,<0.0.14",
    "diffrax>=0.7.2",
    "jax>=0.10.1",
    "jaxlib>=0.10.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
experiments = [
    "matplotlib>=3.10.9",
    "openpyxl>=3.1.5",
]
metal = [
    "jax-mps>=0.10.1",
]

dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["wsckf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]