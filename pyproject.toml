[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cubature-filtering"
version = "0.1.0"
description = "Cubature Recursive Filter for continuous-discrete nonlinear state estimation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "cuthbert>=0.0.12",
    "cuthbertlib>=0.0.12",
    "diffrax>=0.7.2",
    "jax>=0.10.1",
    "jaxlib>=0.10.1",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
experiments = [
    "matplotlib>=3.10.9",
]

dev = [
    "pytest>=8.3.0",
]

[tool.hatch.build.targets.wheel]
packages = ["crf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]